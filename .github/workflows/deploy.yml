name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mault.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'Dockerfile.web'
            server:
              - 'packages/server/**'
              - 'packages/shared/**'
              - 'drizzle/**'
              - 'Dockerfile.server'

      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
          TITLE=$(jq -r '.title // empty' <<< "$PR_JSON")
          if [ -z "$TITLE" ]; then
            TITLE=$(git log -1 --format=%s)
          fi
          echo "url=$(jq -r '.html_url // empty' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          {
            echo "title<<PR_TITLE_EOF"
            echo "$TITLE"
            echo "PR_TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.web == 'true' || steps.changes.outputs.server == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        if: steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Trigger Coolify deployment (web)
        if: steps.changes.outputs.web == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Build server image
        if: steps.changes.outputs.server == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Trigger Coolify deployment (server)
        if: steps.changes.outputs.server == 'true'
        run: |
          curl -sf --request POST "${{ secrets.COOLIFY_WEBHOOK_SERVER }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Notify Discord (success)
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_DEPLOYMENTS_ROLE_ID }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          REDEPLOYED="None"
          if [ "${{ steps.changes.outputs.web }}" = "true" ] && [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            REDEPLOYED="Web, Server"
          elif [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            REDEPLOYED="Web"
          elif [ "${{ steps.changes.outputs.server }}" = "true" ]; then
            REDEPLOYED="Server"
          fi

          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          LINK_URL="${PR_URL:-$COMMIT_URL}"

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$LINK_URL" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "$COMMIT_URL" \
            --arg author "${{ github.actor }}" \
            --arg redeployed "$REDEPLOYED" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg role_id "$DISCORD_ROLE_ID" \
            '{
              content: ("<@&" + $role_id + ">"),
              allowed_mentions: { roles: [$role_id] },
              embeds: [{
                title: $title,
                description: "Mault deployed",
                color: 5763719,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true },
                  { name: "Redeployed", value: $redeployed, inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify Discord (failure)
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: |
          PAYLOAD=$(jq -n \
            --arg title "${PR_TITLE:-Mault deploy failed}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg commit "${GITHUB_SHA::7}" \
            --arg commit_url "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            --arg author "${{ github.actor }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              allowed_mentions: { parse: [] },
              embeds: [{
                title: $title,
                description: "Deploy failed - check the run log.",
                color: 15548997,
                url: $url,
                fields: [
                  { name: "Commit", value: ("[`" + $commit + "`](" + $commit_url + ")"), inline: true },
                  { name: "Author", value: $author, inline: true }
                ],
                timestamp: $ts
              }]
            }')

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
